[package]
name = "fix-my-fnos"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bollard = "0.21"
clap = { version = "4.6", features = ["cargo", "derive", "env"] }
futures-channel = "0.3"
futures-util = "0.3"
ipnet = { version = "2.12", features = ["serde"] }
nix = { version = "0.31.3", features = ["user"] }
rtnetlink = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde-inline-default = "1.0"
tokio = { version = "1.52", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
strip = true
